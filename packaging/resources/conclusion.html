<h2>All buttered up.</h2>
<p><b>Premiere Pro:</b> Settings &gt; Audio &gt; Audio Plug-in Manager &gt; Scan for Plug-ins, then make sure Butterfader is ticked.
Find it in Effects &gt; Audio Effects.</p>
<p><b>Audition:</b> Effects &gt; Audio Plug-in Manager &gt; Scan for Plug-ins.</p>
