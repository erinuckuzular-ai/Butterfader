<h2>Butterfader</h2>
<p>Loudness for any platform: auto level, a true-peak limiter, and clear meters.</p>
<ul>
  <li><b>VST3</b> &rarr; /Library/Audio/Plug-Ins/VST3</li>
  <li><b>Audio Unit</b> &rarr; /Library/Audio/Plug-Ins/Components</li>
</ul>
<p>Premiere Pro and Audition can use either one. Click <b>Customize</b> to pick.</p>
